# Typecheck, tests and the web build on Node 22, plus a gitleaks secret scan. No secrets are needed:
# the tests run on in-memory PGlite with fake PayPal and fake Claude (sandbox e2e tests skip without
# ANSWERTAB_E2E=1). Actions are pinned to commit SHAs (tag in the comment).
name: ci

on:
  push:
    branches: [main]
    tags: ['v*', 'submission-*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      - run: npx vite build

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_CONFIG: .gitleaks.toml
          # Findings fail the job and show in its log and summary; no PR comments (read-only token).
          GITLEAKS_ENABLE_COMMENTS: 'false'
          # Personal-account repos need no GITLEAKS_LICENSE; an organization repo would.
